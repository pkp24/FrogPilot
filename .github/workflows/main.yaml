name: Sync Fork
on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch:

permissions:
  contents: write   # Only non-workflow operations use GITHUB_TOKEN

jobs:
  compare-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with PAT
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Find most recent upstream commit for FrogPilot
        id: upstream_commit_frogpilot
        run: |
          UPSTREAM_COMMIT_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/FrogAi/FrogPilot/commits?per_page=1")
          echo "UPSTREAM_COMMIT_FROGPILOT=$(echo "$UPSTREAM_COMMIT_JSON" | jq -r '.[0].sha')" >> $GITHUB_ENV

      - name: Find most recent upstream commit for FrogPilot-Staging
        id: upstream_commit_staging
        run: |
          UPSTREAM_COMMIT_STAGING_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/FrogAi/FrogPilot/branches/FrogPilot-Staging")
          echo "UPSTREAM_COMMIT_STAGING=$(echo "$UPSTREAM_COMMIT_STAGING_JSON" | jq -r '.commit.sha')" >> $GITHUB_ENV

      - name: Find most recent upstream commit for FrogPilot-Testing
        id: upstream_commit_testing
        run: |
          UPSTREAM_COMMIT_TESTING_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/FrogAi/FrogPilot/branches/FrogPilot-Testing")
          echo "UPSTREAM_COMMIT_TESTING=$(echo "$UPSTREAM_COMMIT_TESTING_JSON" | jq -r '.commit.sha')" >> $GITHUB_ENV

      - name: Find your most recent commit for FrogPilot (excluding your commits and actions bot)
        id: your_commit_frogpilot
        run: |
          YOUR_COMMIT_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/pkp24/FrogPilot/commits?per_page=100")
          echo "YOUR_COMMIT_FROGPILOT=$(echo "$YOUR_COMMIT_JSON" | jq '[.[] | select(.author.login != "actions-user" and .author.login != "pkp24")][0].sha' -r)" >> $GITHUB_ENV

      - name: Find your most recent commit for FrogPilot-Staging
        id: your_commit_staging
        run: |
          YOUR_COMMIT_STAGING_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/pkp24/FrogPilot/branches/FrogPilot-Staging")
          echo "YOUR_COMMIT_STAGING=$(echo "$YOUR_COMMIT_STAGING_JSON" | jq -r '.commit.sha')" >> $GITHUB_ENV

      - name: Find your most recent commit for FrogPilot-Testing
        id: your_commit_testing
        run: |
          YOUR_COMMIT_TESTING_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/pkp24/FrogPilot/branches/FrogPilot-Testing")
          echo "YOUR_COMMIT_TESTING=$(echo "$YOUR_COMMIT_TESTING_JSON" | jq -r '.commit.sha')" >> $GITHUB_ENV

      - name: Display commit information
        run: |
          echo "Upstream/FrogPilot: $UPSTREAM_COMMIT_FROGPILOT"
          echo "Your/FrogPilot:     $YOUR_COMMIT_FROGPILOT"
          echo "Upstream/Staging:   $UPSTREAM_COMMIT_STAGING"
          echo "Your/Staging:       $YOUR_COMMIT_STAGING"
          echo "Upstream/Testing:   $UPSTREAM_COMMIT_TESTING"
          echo "Your/Testing:       $YOUR_COMMIT_TESTING"

      - name: Compare commits and sync branches
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PAT: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
        run: |
          # Sync FrogPilot branch
          if [ "$UPSTREAM_COMMIT_FROGPILOT" != "$YOUR_COMMIT_FROGPILOT" ]; then
            git clone --depth 1 https://github.com/pkp24/FrogPilot.git FrogPilot
            cd FrogPilot
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git remote add upstream https://github.com/FrogAi/FrogPilot.git
            git fetch upstream FrogPilot --depth 1
            git reset --hard upstream/FrogPilot
            git push https://$GITHUB_ACTOR:$PAT@github.com/pkp24/FrogPilot.git HEAD:FrogPilot --force
            cd .. && rm -rf FrogPilot
          else
            echo "FrogPilot branch is up to date."
          fi

          # Sync FrogPilot-Staging branch
          if [ "$UPSTREAM_COMMIT_STAGING" != "$YOUR_COMMIT_STAGING" ]; then
            git clone --depth 1 https://github.com/pkp24/FrogPilot.git FrogPilot-Staging
            cd FrogPilot-Staging
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git remote add upstream https://github.com/FrogAi/FrogPilot.git
            git fetch upstream FrogPilot-Staging --depth 1
            git reset --hard upstream/FrogPilot-Staging
            git push https://$GITHUB_ACTOR:$PAT@github.com/pkp24/FrogPilot.git HEAD:FrogPilot-Staging --force
            cd .. && rm -rf FrogPilot-Staging
          else
            echo "FrogPilot-Staging branch is up to date."
          fi

          # Sync FrogPilot-Testing branch
          if [ "$UPSTREAM_COMMIT_TESTING" != "$YOUR_COMMIT_TESTING" ]; then
            git clone --depth 1 https://github.com/pkp24/FrogPilot.git FrogPilot-Testing
            cd FrogPilot-Testing
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git remote add upstream https://github.com/FrogAi/FrogPilot.git
            git fetch upstream FrogPilot-Testing --depth 1
            git reset --hard upstream/FrogPilot-Testing
            git push https://$GITHUB_ACTOR:$PAT@github.com/pkp24/FrogPilot.git HEAD:FrogPilot-Testing --force
            cd .. && rm -rf FrogPilot-Testing
          else
            echo "FrogPilot-Testing branch is up to date."
          fi
