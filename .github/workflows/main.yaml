name: Sync Fork

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes (default branch only!)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (Actions branch)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
          persist-credentials: false

      # ---- Get upstream heads ----
      - name: Get upstream FrogPilot head
        run: |
          json=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/FrogAi/FrogPilot/branches/FrogPilot")
          echo "UPSTREAM_FROGPILOT=$(echo "$json" | jq -r '.commit.sha')" >> $GITHUB_ENV

      - name: Get upstream FrogPilot-Staging head
        run: |
          json=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/FrogAi/FrogPilot/branches/FrogPilot-Staging")
          echo "UPSTREAM_STAGING=$(echo "$json" | jq -r '.commit.sha')" >> $GITHUB_ENV

      - name: Get upstream FrogPilot-Testing head
        run: |
          json=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/FrogAi/FrogPilot/branches/FrogPilot-Testing")
          echo "UPSTREAM_TESTING=$(echo "$json" | jq -r '.commit.sha')" >> $GITHUB_ENV

      # ---- Get your fork heads ----
      - name: Get your FrogPilot head
        run: |
          json=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/pkp24/FrogPilot/branches/FrogPilot")
          echo "YOUR_FROGPILOT=$(echo "$json" | jq -r '.commit.sha')" >> $GITHUB_ENV

      - name: Get your FrogPilot-Staging head
        run: |
          json=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/pkp24/FrogPilot/branches/FrogPilot-Staging")
          echo "YOUR_STAGING=$(echo "$json" | jq -r '.commit.sha')" >> $GITHUB_ENV

      - name: Get your FrogPilot-Testing head
        run: |
          json=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/pkp24/FrogPilot/branches/FrogPilot-Testing")
          echo "YOUR_TESTING=$(echo "$json" | jq -r '.commit.sha')" >> $GITHUB_ENV

      - name: Show commit info
        run: |
          echo "Upstream FrogPilot:         $UPSTREAM_FROGPILOT"
          echo "Your FrogPilot:             $YOUR_FROGPILOT"
          echo "Upstream FrogPilot-Staging: $UPSTREAM_STAGING"
          echo "Your FrogPilot-Staging:     $YOUR_STAGING"
          echo "Upstream FrogPilot-Testing: $UPSTREAM_TESTING"
          echo "Your FrogPilot-Testing:     $YOUR_TESTING"

      - name: Sync branches if needed
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PAT: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
        run: |
          set -e

          sync_branch () {
            local upstream_sha="$1"
            local your_sha="$2"
            local branch="$3"

            if [ "$upstream_sha" != "$your_sha" ]; then
              echo "Syncing branch $branch ..."
              git clone --depth 1 https://github.com/pkp24/FrogPilot.git tmp-repo
              cd tmp-repo

              git config user.name  "GitHub Actions"
              git config user.email "actions@users.noreply.github.com"

              git remote add upstream https://github.com/FrogAi/FrogPilot.git
              git fetch upstream "$branch" --depth 1

              git checkout -B "$branch" "upstream/$branch"
              git push "https://$GITHUB_ACTOR:$PAT@github.com/pkp24/FrogPilot.git" "$branch" --force

              cd ..
              rm -rf tmp-repo
            else
              echo "Branch $branch is already up to date."
            fi
          }

          sync_branch "$UPSTREAM_FROGPILOT" "$YOUR_FROGPILOT"  "FrogPilot"
          sync_branch "$UPSTREAM_STAGING"   "$YOUR_STAGING"    "FrogPilot-Staging"
          sync_branch "$UPSTREAM_TESTING"   "$YOUR_TESTING"    "FrogPilot-Testing"